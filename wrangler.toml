# Cloudflare Workers static assets — build via `npm run build:workers` then `wrangler deploy`
# Canonical URLs in HTML/sitemap stay https://hunt-cheat.com (see scripts/build-workers.mjs).
name = "hunt-cheat-com"
compatibility_date = "2025-11-08"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
